[package]
name = "pdb-rs"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Read, write and edit native PDB, PDZ (MSFZ) and Portable PDB debug information files"
readme = "../../README.md"
keywords = ["pdb", "msf", "codeview", "debuginfo", "portable-pdb"]
categories = ["parser-implementations", "development-tools::debugging", "encoding", "no-std"]

[features]
default = ["std"]
std = ["nostdio/std"]

[dependencies]
miniz_oxide.workspace = true
nostdio.workspace = true
ruzstd.workspace = true
sha2.workspace = true

[lints]
workspace = true

[[example]]
name = "inspect"
required-features = ["std"]

[[example]]
name = "native"
required-features = ["std"]

[[example]]
name = "msf"
required-features = ["std"]

[[example]]
name = "portable"
required-features = ["std"]

[[example]]
name = "locate"
required-features = ["std"]

[[example]]
name = "native_rebuild"
required-features = ["std"]

[[example]]
name = "native_synthetic"
required-features = ["std"]

[[example]]
name = "edit"
required-features = ["std"]

[[example]]
name = "types"
required-features = ["std"]

[[bench]]
name = "baseline"
harness = false
required-features = ["std"]
