# The fuzz targets of `pdb-rs`. See `README.md`.
#
# This package has its own workspace. The stable workspace checks of `AGENTS.md` do not build
# it, because `libfuzzer-sys` and the sanitizers need a nightly toolchain.

[package]
name = "pdb-rs-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[workspace]

[dependencies]
libfuzzer-sys = "0.4"
pdb-rs = { path = ".." }

[lints.rust]
missing_docs = "deny"
unsafe_code = "deny"
unused = "deny"

[lints.clippy]
pedantic = { level = "deny", priority = -1 }

[[bin]]
name = "msf"
path = "fuzz_targets/msf.rs"
test = false
doc = false
bench = false

